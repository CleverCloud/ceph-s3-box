---
name: Release to DockerHub

# Define when this workflow will run
on:
  release:
    types: [published]

# Prevent multiple workflows running at the same time
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  docker-build-and-push:
    name: Docker build and push (${{ matrix.version_name }})
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        # pacific has no jammy packages on download.ceph.com; pin each track to
        # the newest Ubuntu release its upstream apt repo still supports.
        include:
          - version_name: pacific
            ubuntu_version: "20.04"
          - version_name: reef
            ubuntu_version: "22.04"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate release tag
        run: |
          tag="${{ github.event.release.tag_name }}"
          if ! [[ "$tag" =~ ^[0-9]{8}(\.[0-9]+)?$ ]]; then
            echo "::error::release tag '$tag' must be YYYYMMDD or YYYYMMDD.N"
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          buildkitd-flags: --debug
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Set up Docker layer caching (scoped per Ceph version — base layers differ)
      - name: Set up Docker cache
        uses: actions/cache@v3
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ matrix.version_name }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-${{ matrix.version_name }}-

      # Build and push the image
      - name: Build and push tagged image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: 'true'
          platforms: linux/amd64
          build-args: |
            VERSION_NAME=${{ matrix.version_name }}
            UBUNTU_VERSION=${{ matrix.ubuntu_version }}
          tags: clevercloud/testcontainer-ceph:${{ matrix.version_name }}-${{ github.event.release.tag_name }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      # Move cache for next runs
      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache
...
